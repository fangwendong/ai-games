[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-quant-bot"
version = "0.1.0"
description = "IBKR quant trading scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ib-insync>=0.9.86",
]

[project.scripts]
ibkr-bot = "ibkr_quant_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
